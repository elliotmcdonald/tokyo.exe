<head>

<style>
@font-face{font-family:"DotGothic16";src:url("fonts/dotgothic16.woff2") format("woff2");font-display:swap}
:root{--bg:#251B23;--bg2:#180F17;--fg:#F2E4EA;--mut:#9B8795;--acc:#E5583F;--ln:#41303D;--gold:#E8B547;--ok:#7FD08A;--px:'DotGothic16',ui-monospace,monospace;--g:max(18px,env(safe-area-inset-left,0px));--gr:max(18px,env(safe-area-inset-right,0px));color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--px);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px dashed var(--acc);outline-offset:3px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;padding-top:calc(env(safe-area-inset-top,0px) + 8px);user-select:none;-webkit-user-select:none}
.dt{font-size:11px;letter-spacing:2px;color:var(--mut)}
.hd{display:flex;align-items:center;gap:4px;padding:10px var(--gr) 0 var(--g)}
.logo{flex:1;font-size:22px;letter-spacing:1px;cursor:pointer}.logo b{font-weight:400;color:var(--acc)}
.pb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .12s steps(2)}
.pb:active{transform:scale(.88)}
.sub{padding:0 var(--gr) 0 var(--g);margin-top:-2px}
.srch{display:none;padding:6px var(--gr) 0 var(--g)}.srch.o{display:block}
.chips{display:flex;gap:16px;padding:12px var(--gr) 10px var(--g);overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar,.list::-webkit-scrollbar,.sh::-webkit-scrollbar{display:none}
.ch{font-size:11px;letter-spacing:1px;color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:24px}
.ch i{width:6px;height:6px;display:inline-block}
.ch.on{color:var(--fg)}.ch.on::before{content:'▸';color:var(--acc);margin-right:-2px}
.ch.op{border:1.5px solid var(--ln);padding:3px 8px}.ch.op.on{border-color:var(--ok);color:var(--ok)}.ch.op.on::before{content:none}
.body{flex:1;position:relative;min-height:0;border-top:2px solid var(--bg2)}
#map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#4B98DD;cursor:grab}
#mv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#mv img{max-width:none!important;max-height:none!important;min-width:0;flex:none;display:block;image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none;pointer-events:none}
#lbl,#pins{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;font-size:10px;letter-spacing:1px;color:var(--fg);background:rgba(37,27,35,.72);padding:1px 4px;white-space:nowrap;transform:translate(-50%,5px)}
.lb.mj{font-size:11px;background:rgba(37,27,35,.85)}
.lb.lm{transform:translate(-50%,calc(-100% - 6px));color:var(--gold);background:rgba(37,27,35,.8)}.lb.lm::after{top:auto;bottom:-5px;background:var(--gold)}
.lb::after{content:'';position:absolute;left:50%;top:-5px;width:3px;height:3px;margin-left:-1px;background:var(--fg)}
.pin{position:absolute;left:0;top:0;width:30px;height:30px;margin:-26px 0 0 -15px;transition:none}
.pin img,.clu img{display:block;width:100%;height:100%;image-rendering:pixelated;-webkit-user-drag:none}
.pin.st::after{content:'✦';position:absolute;right:-5px;bottom:-1px;font-size:11px;line-height:1;color:#E8B547;text-shadow:0 0 2px #251B23,0 0 2px #251B23}
.pin svg{display:block}
.dot{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;box-shadow:0 0 0 2px #251B23,2px 3px 0 1px rgba(0,0,0,.18)}
.dot.st::after{content:'';position:absolute;inset:3px;background:#E8B547}
.clu{position:absolute;left:0;top:0;width:30px;height:30px;margin:-26px 0 0 -15px}
.clu b{position:absolute;right:-9px;top:-7px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:#251B23;color:#F2E4EA;font-weight:400;font-size:10px;line-height:17px;text-align:center;box-shadow:0 0 0 1.5px #F2E4EA}


.pin.loo{width:20px;height:20px;margin:-18px 0 0 -10px;opacity:.85}
.pin.sel{z-index:3;width:45px;height:45px;margin:-40px 0 0 -22px}
.ri{width:30px;height:30px;flex:none;image-rendering:pixelated;margin:-4px 0}
.ptag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);background:var(--bg);color:var(--fg);font-size:11px;letter-spacing:1px;padding:4px 7px;white-space:nowrap;box-shadow:2px 2px 0 var(--bg2)}
.you{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;background:#5AA9FF;border:2px solid #fff;box-shadow:0 0 0 0 rgba(90,169,255,.6);animation:pulse 1.6s steps(6) infinite}
@keyframes pulse{to{box-shadow:0 0 0 12px rgba(90,169,255,0)}}
.mbtn{position:absolute;width:44px;height:44px;background:var(--bg);box-shadow:3px 3px 0 var(--bg2);display:flex;align-items:center;justify-content:center;z-index:4}
.mbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--bg2)}
#zin{right:14px;bottom:124px}#zout{right:14px;bottom:72px}#loc{right:14px;bottom:20px}
.peek{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--bg2);padding:12px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--g);display:flex;align-items:center;gap:12px;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,1,.3,1);cursor:pointer}
.peek.o{transform:none}
.peek .nm{font-size:15px;letter-spacing:1px;overflow-wrap:anywhere}
.peek .mt{font-size:11px;letter-spacing:1px;color:var(--mut);margin-top:4px}
.peek .stt{font-size:11px;letter-spacing:1px;text-align:right;white-space:nowrap}
.sq{flex:none;width:10px;height:10px;display:inline-block}
.list{position:absolute;inset:0;overflow-y:auto;padding:0 var(--gr) calc(30px + env(safe-area-inset-bottom,0px)) var(--g);scrollbar-width:none;-webkit-overflow-scrolling:touch;display:none}
.list.o{display:block}
.gh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;margin-top:18px;padding-bottom:2px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--ln);width:100%;text-align:left}
.row .nm{font-size:13px;letter-spacing:1px;line-height:1.4;overflow-wrap:anywhere}
.row .mt{font-size:10px;letter-spacing:1px;color:var(--mut);margin-top:3px}
.row .stt{font-size:10px;letter-spacing:1px;text-align:right;flex:none;max-width:42%}
.row .stp{color:var(--gold);font-size:10px;margin-left:6px}
.c-ok{color:var(--ok)}.c-soon{color:var(--gold)}.c-no{color:var(--mut)}.c-mk{color:var(--gold)}
.empty{text-align:center;padding:56px 0;line-height:1.9}
.box{border:2px solid var(--fg);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg);background:var(--bg)}
.ts{position:absolute;left:var(--g);right:var(--gr);bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:12px 14px;font-size:12px;letter-spacing:1px;display:flex;justify-content:space-between;gap:10px;transform:translateY(14px);opacity:0;transition:all .3s steps(3);pointer-events:none;z-index:30}
.ts.o{transform:none;opacity:1;pointer-events:auto}
#un{color:var(--acc);font-size:12px;letter-spacing:2px}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;scrollbar-width:none;z-index:21;border-top:2px solid var(--fg);background:var(--bg);padding:14px var(--gr) calc(28px + env(safe-area-inset-bottom,0px)) var(--g);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,1.1,.3,1)}
.bd.o{opacity:1;pointer-events:auto}.sh.o{transform:none}
.grip{width:44px;height:4px;background:var(--fg);margin:0 auto 14px;background-clip:content-box;padding:8px 10px;box-sizing:content-box;margin-top:-8px;display:block}
.st{font-size:17px;letter-spacing:1px;margin-bottom:6px}
.kat{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px}
.big{font-size:24px;letter-spacing:1px;margin-top:10px;line-height:1.25;overflow-wrap:anywhere}
.area{font-size:11px;letter-spacing:2px;color:var(--mut);margin-top:6px}
.status{font-size:12px;letter-spacing:1px;margin-top:12px;display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;display:inline-block;flex:none}
.mrow{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px dashed var(--ln);font-size:12px;letter-spacing:1px;width:100%;gap:16px;text-align:left}
.mrow .k{color:var(--mut);font-size:11px;letter-spacing:2px;flex:none}
.mrow .v{text-align:right;overflow-wrap:anywhere}
.mrow.cy .v::before{content:'◀ ';font-size:8px;color:var(--ln)}.mrow.cy .v::after{content:' ▶';font-size:8px;color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:10px;letter-spacing:1px;padding:4px 7px;border:1.5px solid var(--ln);color:var(--fg)}
.tag.w{border-color:var(--gold);color:var(--gold)}
.note{font-size:12px;letter-spacing:1px;line-height:1.75;padding:12px 0;border-bottom:1px dashed var(--ln)}
.wk{font-size:11px;letter-spacing:1px;line-height:1.9;color:var(--mut);padding:4px 0 8px;display:none}.wk.o{display:block}
.wk b{font-weight:400;color:var(--fg)}
.acts{display:flex;gap:14px;align-items:stretch;margin-top:18px}
.go{flex:1;height:50px;background:var(--fg);color:var(--bg);box-shadow:4px 4px 0 var(--acc);font-size:14px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--acc)}
.stb{width:78px;height:50px;border:2px solid var(--fg);font-size:11px;letter-spacing:1px}
.stb.on{border-color:var(--gold);color:var(--gold)}
.lnk{font-size:11px;letter-spacing:2px;color:var(--mut);margin-top:16px;display:flex;justify-content:space-between;gap:12px}
.in{display:block;width:100%;font-family:var(--px);font-size:16px;letter-spacing:1px;background:transparent;border:0;border-bottom:1px dashed var(--ln);border-radius:0;color:var(--fg);outline:none;padding:6px 0 8px;-webkit-appearance:none;appearance:none;user-select:text;-webkit-user-select:text}
.in::placeholder{color:var(--mut);opacity:.7}.in:focus{border-bottom-color:var(--acc)}
textarea.in{resize:none;font-size:14px;line-height:1.6}
.bt{display:inline-flex;padding:10px 18px;border:2px solid var(--fg);box-shadow:3px 3px 0 var(--fg);font-size:12px;letter-spacing:2px;background:var(--fg);color:var(--bg)}
.bt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--fg)}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.er{color:var(--acc);min-height:16px;margin-top:10px}
.prog{display:grid;gap:2px;margin-top:12px;height:10px}
.prog i{display:block;background:var(--ln)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;margin-top:22px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ring{width:86px;height:86px;border-radius:50%;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}
.ring small{font-size:9px;letter-spacing:1px;margin-top:4px}
.stamp span{font-size:10px;letter-spacing:1px;line-height:1.4}
.slam{position:absolute;left:50%;top:40%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:5px solid var(--gold);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;z-index:40;pointer-events:none;background:rgba(37,27,35,.6)}
.slam small{font-size:11px;letter-spacing:2px;margin-top:6px}
.spl{position:absolute;inset:0;z-index:50;background:var(--bg);cursor:pointer}
.spl .tor{position:absolute;left:50%;top:calc(34% + 4px);width:112px;height:96px;margin-left:-56px;animation:bob 1.6s steps(5) infinite alternate}
.spl .gsh{position:absolute;left:50%;top:calc(34% + 118px);width:74px;height:6px;margin-left:-37px;background:var(--bg2);animation:shd 1.6s steps(5) infinite alternate}
@keyframes bob{to{transform:translateY(-14px)}}@keyframes shd{to{transform:scaleX(.6);opacity:.55}}
.spl .dt{position:absolute;left:0;right:0;text-align:center}
.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.syd[hidden]{display:none}.syd{display:inline-block;width:6px;height:6px;margin-left:8px;vertical-align:middle;background:var(--ln)}.syd.ok{background:var(--ok)}.syd.busy{background:var(--gold);animation:bl .8s steps(1) infinite}.syd.err{background:var(--acc)}
@media (prefers-reduced-motion:reduce){.bl,.syd.busy,.spl .tor,.spl .gsh,.you{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="spl" id="spl" role="button" aria-label="Tap to begin">
    <svg class="tor" viewBox="0 0 14 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#E5583F" d="M0 0h2v1H0z M12 0h2v1h-2z M0 1h14v2H0z M2 5h10v1H2z M3 3h2v9H3z M9 3h2v9H9z M6 3h2v2H6z"/><path fill="#F39A84" d="M1 1h12v1H1z M3 3h1v9H3z M9 3h1v9H9z"/></svg>
    <div class="gsh"></div>
    <div class="dt" style="top:calc(34% + 150px);font-size:24px;letter-spacing:1px;color:var(--fg)">tokyo<span style="color:var(--acc)">.</span>exe</div>
    <div class="dt" style="top:calc(34% + 192px)">28 oct – 23 nov</div>
    <div class="dt bl" style="top:calc(34% + 236px);color:var(--fg);font-size:13px">▸ tap to begin</div>
  </div>
  <div class="hd">
    <div class="logo" id="logo" role="button" aria-label="Sync">tokyo<b>.</b>exe<i class="syd" id="syd" hidden></i></div>
    <button class="pb" id="bsrch" aria-label="Search saved spots"><svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="#F2E4EA" d="M2 0h4v1H2z M1 1h1v1H1z M6 1h1v1H6z M0 2h1v4H0z M7 2h1v4H7z M1 6h1v1H1z M6 6h1v1H6z M2 7h4v1H2z M7 7h1v1H7z M8 8h1v1H8z M9 9h1v1H9z M10 10h1v1h-1z"/></svg></button>
    <button class="pb" id="bview" aria-label="Show as list"></button>
    <button class="pb" id="bstamp" aria-label="Stamp book"><svg width="24" height="24" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#F2E4EA" d="M4 0h4v1H4z M2 1h2v1H2z M8 1h2v1H8z M1 2h1v2H1z M10 2h1v2h-1z M0 4h1v4H0z M11 4h1v4h-1z M1 8h1v2H1z M10 8h1v2h-1z M2 10h2v1H2z M8 10h2v1H8z M4 11h4v1H4z"/><path fill="#E8B547" d="M5 3h2v2H5z M3 5h6v2H3z M5 7h2v2H5z"/></svg></button>
  </div>
  <div class="sub dt" id="sub"></div>
  <div class="srch" id="srch"><input class="in" id="q" type="search" placeholder="search name, area, note…" autocomplete="off" enterkeyhint="search"></div>
  <div class="chips" id="chips"></div>
  <div class="body">
    <div id="map" aria-label="Map of saved spots">
      <div id="mv"><img id="mimg" alt=""></div>
      <div id="lbl"></div>
      <div id="pins"></div>
      <button class="mbtn" id="zin" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#F2E4EA" d="M3 0h2v8H3z M0 3h8v2H0z"/></svg></button>
      <button class="mbtn" id="zout" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#F2E4EA" d="M0 3h8v2H0z"/></svg></button>
      <button class="mbtn" id="loc" aria-label="Show where I am"><svg width="22" height="22" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="#F2E4EA" d="M5 0h1v3H5z M5 8h1v3H5z M0 5h3v1H0z M8 5h3v1H8z M3 2h5v1H3z M3 8h5v1H3z M2 3h1v5H2z M8 3h1v5H8z"/><path fill="#E5583F" d="M5 5h1v1H5z"/></svg></button>
      <div class="peek" id="peek"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="ts box" id="ts" role="status"><span id="tx"></span><button id="un">undo</button></div>
  <div class="bd" id="bd"></div>
  <div class="sh" id="sh"></div>
</div>
<script src="vendor/supabase.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- data ---------- */
const SPOTS=/*SPOTS*/;
const ICONS=/*ICONS*/;
const CATICON={coffee:'coffee',eat:'onigiri',markets:'tag',thrift:'tee',records:'record',jazz:'jazz',bars:'cocktail',craft:'lamp',shops:'bag',shrines:'torii',sights:'sparkle',film:'film',loo:'toilet'};
const icOf=p=>ICONS[p.ic]||ICONS[CATICON[p.c]]||ICONS.sparkle;
const PJ={W:944,H:659,LNG0:139.515,LAT1:35.775,KX:2817.621126910331,KY:3468.75};
const HOME={lat:35.6707238,lng:139.6710513};
const TRIP0='2026-10-28',TRIP1='2026-11-23';
const CATS={coffee:{n:'coffee & tea',c:'#C08A5F',k:'珈琲'},eat:{n:'ramen & food',c:'#E5583F',k:'麺'},markets:{n:'flea & antiques',c:'#E8B547',k:'市'},thrift:{n:'thrift',c:'#F29A5B',k:'古'},
  records:{n:'records',c:'#E77FB0',k:'盤'},jazz:{n:'jazz kissa',c:'#9A8AF2',k:'音'},bars:{n:'bars',c:'#5FC2D9',k:'酒'},craft:{n:'design & craft',c:'#3FB5AA',k:'器'},
  shops:{n:'shops',c:'#8FA3FF',k:'店'},shrines:{n:'shrines & temples',c:'#F2E4EA',k:'社'},film:{n:'perfect days',c:'#E8B547',k:'映'},loo:{n:'free toilets',c:'#8CC4E8',k:'WC'},sights:{n:'sights & parks',c:'#B5E06A',k:'景'}};

function ep(f,t0=0,v=.1,du=1.1){const a=ac(),t=a.currentTime+t0,g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(v*.35,t+.18);g.gain.exponentialRampToValueAtTime(.0001,t+du);g.connect(M);

  return{iso:`${g('year')}-${g('month')}-${g('day')}`,dow:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(g('weekday')),min:(+g('hour'))*60+(+g('minute'))}}
const pm=s=>{const [h,m]=s.split(':').map(Number);return h*60+(m||0)};
const fm=m=>{m=((m%1440)+1440)%1440;return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};

  if(p.dates&&p.dates.length){const dh=(p.dh||'').replace('dawn','6:00');const [a,b]=dh.includes('-')?dh.split('-'):['',''];
    if(p.dates.includes(t.iso)){if(a&&t.min<pm(a))return{c:'c-mk',s:`market today · from ${a}`};if(b&&t.min>=pm(b))return{c:'c-no',s:'market over for today'};return{c:'c-ok',s:`market today${b?' · till '+b:''}`,open:1}}
    const nx=p.dates.find(d=>d>t.iso);return nx?{c:'c-mk',s:`next market ${dlong(nx)}`}:{c:'c-no',s:'no more dates this trip'}}
  if(!p.h||p.h.length!==7)return{c:'c-no',s:'hours vary · check'};
  const today=ranges(p.h[t.dow]),yest=ranges(p.h[(t.dow+6)%7]);
  for(const [a,b] of yest)if(b>1440&&t.min<b-1440)return{c:b-1440-t.min<=45?'c-soon':'c-ok',s:(b-1440-t.min<=45?'closes soon · ':'open · till ')+fm(b),open:1};
  for(const [a,b] of today){if(a===0&&b===1440)return{c:'c-ok',s:'open 24h',open:1};if(t.min>=a&&t.min<b)return{c:b-t.min<=45?'c-soon':'c-ok',s:(b-t.min<=45?'closes soon · ':'open · till ')+fm(b),open:1}}
  for(const [a] of today)if(a>t.min)return{c:'c-no',s:`closed · opens ${fm(a)}`};
  for(let i=1;i<=7;i++){const r=ranges(p.h[(t.dow+i)%7]);if(r.length)return{c:'c-no',s:`closed · opens ${i===1?'tomorrow':DOW[(t.dow+i)%7]} ${fm(r[0][0])}`}}
  return{c:'c-no',s:'closed'}}

  rows.forEach(r=>{if(r.deleted)delete sy.last[r.id];else sy.last[r.id]=r.j});sySave()}
async function pull(){const first=!sy.cur;let q=sb.from(TBL).select('id,kind,data,deleted,updated_at').order('updated_at').limit(5000);
  if(!first)q=q.gt('updated_at',new Date(Date.parse(sy.cur.slice(0,19)+'Z')-5000).toISOString());
  const {data,error}=await q;if(error)throw error;let changed=false;const recs=records();
  for(const row of data){const id=row.id,local=recs.get(id),lj=local?canon(local.data):undefined,rj=canon(row.data);if(!sy.cur||row.updated_at>sy.cur)sy.cur=row.updated_at;
    if(row.deleted){const dirty=local?sy.last[id]!==lj:false;if(local&&!dirty&&!first){removeId(id);changed=true}delete sy.last[id];continue}
    const dirty=local?sy.last[id]!==lj:(id in sy.last);if(dirty&&!first)continue;
    if(lj!==rj){applyRow(id,row.kind,row.data);changed=true}if(!first||!local||lj===rj)sy.last[id]=rj}
  if(!sy.cur)sy.cur=new Date(0).toISOString();sySave();return changed}
function syncSoon(ms=700){if(!me)return;clearTimeout(syT);syT=setTimeout(syncNow,ms)}
async function syncNow(){if(!me||!sb)return;if(syBusy){syAgain=true;return}syBusy=true;setSy('busy');
  try{if(sy.cur)await push();const ch=await pull();if(ch){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}refresh()}await push();setSy('ok')}
  catch(e){const m=(e&&e.message)||'';const missing=e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(m));const denied=e&&(e.code==='42501'||e.status===401||e.status===403||/row-level security/i.test(m));
    setSy('err',missing?'sync table missing · run the setup script':denied?'this email isn’t on the members list':'offline · will retry')}
  finally{syBusy=false;if(syAgain){syAgain=false;syncSoon(300)}}}
function setSy(s,m=''){syState=s;syMsg=m;const d=$('syd');d.hidden=!me;d.className='syd '+(s==='ok'?'ok':s==='busy'?'busy':s==='off'?'':'err');const el=$('syst');if(el)el.textContent=syLabel()}
const syLabel=()=>syState==='ok'?'✦ synced':syState==='busy'?'syncing…':syMsg||'';
function startLive(){if(live||!sb)return;live=sb.channel(TBL).on('postgres_changes',{event:'*',schema:'public',table:TBL},()=>syncSoon(300)).subscribe()}
function sbInit(){if(sb)return sb;if(!window.supabase)return null;
  try{sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'tokyoexe.auth'}});
  sb.auth.onAuthStateChange((ev,ss)=>{const u=ss&&ss.user||null,was=me;me=u;if(ev==='PASSWORD_RECOVERY')setTimeout(newPass,300);
    if(u&&!was)setTimeout(()=>{startLive();syncNow()},0);
    if(!u&&was){if(live){sb.removeChannel(live);live=null}setSy('off')}else setSy(syState)})}catch(e){sb=null}return sb}
function syncSheet(){sfx('pop');if(!sbInit()){openSh(`<div class="st">sync</div><div class="dt">sync couldn’t load · check your connection</div>`);return}
  if(me){openSh(`<div class="st">sync</div><div class="dt" style="margin-bottom:6px">stamps, notes and added spots are shared between your phones</div>
    <div class="mrow"><span class="k">signed in</span><span class="v">${esc(me.email)}</span></div>
    <div class="mrow"><span class="k">status</span><span class="v" id="syst">${syLabel()}</span></div>
    <div class="row2"><button class="dt" id="syout" style="color:var(--acc)">sign out</button><button class="bt" id="synow">sync now</button></div>`);
    $('synow').onclick=()=>{sfx('tap');syncNow()};
    let armed=false;$('syout').onclick=async()=>{if(!armed){armed=true;sfx('tap');$('syout').textContent='tap again to sign out';return}sfx('undo');await sb.auth.signOut();sy={last:{},cur:null};sySave();shut();toast('signed out · your stamps stay on this phone')};return}
  let mode='in';openSh(`<div class="st">sync</div><div class="dt" style="margin-bottom:8px">same account as quest.exe</div>
    <input class="in" id="sye" type="email" inputmode="email" autocomplete="email" placeholder="your email" autocapitalize="off">
    <input class="in" id="syp" type="password" autocomplete="current-password" placeholder="password">
    <div class="dt er" id="syer"></div><div class="row2"><button class="dt" id="symode">first time? create account</button><button class="bt" id="sygo">sign in</button></div><button class="dt" id="syfg" style="margin-top:16px">forgot password?</button>`);
  const er=t=>$('syer').textContent=t;setTimeout(()=>$('sye').focus(),350);
  $('symode').onclick=()=>{sfx('tap');mode=mode==='in'?'up':'in';er('');$('sygo').textContent=mode==='in'?'sign in':'create account';$('symode').textContent=mode==='in'?'first time? create account':'have an account? sign in'};
  $('sygo').onclick=async()=>{const b=$('sygo'),email=$('sye').value.trim().toLowerCase(),password=$('syp').value;er('');
    if(!/^\S+@\S+\.\S+$/.test(email)){er('that email doesn’t look right');return}if(password.length<(mode==='up'?8:1)){er(mode==='up'?'use at least 8 characters':'enter your password');return}
    b.disabled=true;const lbl=b.textContent;b.textContent='one sec…';
    const r=mode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});b.disabled=false;b.textContent=lbl;
    if(r.error){const m=r.error.message||'';er(/not confirmed/i.test(m)?'this account isn’t confirmed yet · confirm it in supabase':/invalid login/i.test(m)?'no account with that email + password':/rate|seconds/i.test(m)?'too many tries · wait a minute':m.toLowerCase());return}
    if(!r.data.session){er('account made · turn off “confirm email” in supabase, then sign in');return}
    sfx('grant');shut();toast('✦ signed in · syncing')};
  $('syfg').onclick=async()=>{const email=$('sye').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email)){er('type your email above first');return}sfx('tap');
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});er(error?error.message.toLowerCase():'check your email for a reset link')};
  ['sye','syp'].forEach(id=>$(id).onkeydown=e=>{if(e.key==='Enter')$('sygo').click()})}
function newPass(){$('spl').hidden=true;openSh(`<div class="st">new password</div><input class="in" id="np" type="password" autocomplete="new-password" placeholder="new password (8+ characters)"><div class="dt er" id="nper"></div><div class="row2" style="justify-content:center"><button class="bt" id="npgo">save password</button></div>`);
  $('npgo').onclick=async()=>{const pw=$('np').value;if(pw.length<8){$('nper').textContent='use at least 8 characters';return}const {error}=await sb.auth.updateUser({password:pw});if(error){$('nper').textContent=error.message.toLowerCase();return}sfx('grant');shut();history.replaceState(null,'',location.pathname);toast('✦ password changed')}}
$('logo').onclick=syncSheet;
sbInit();
setInterval(()=>{if(!document.hidden){syncSoon(0);sub();if(st.view==='list')list();else if(sel)peek()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();syncSoon(0)}});

/* ---------- boot ---------- */
const spl=$('spl');
spl.addEventListener('click',()=>{if(spl.dataset.b)return;spl.dataset.b=1;try{ac();if(AC.state!=='running'){AC.resume().then(()=>sfx('intro'))}else sfx('intro')}catch(e){}spl.animate([{opacity:1},{opacity:0}],{duration:600,delay:250,easing:'ease-in-out',fill:'forwards'}).onfinish=()=>spl.hidden=true});
function boot(){refresh();if(st.cx!=null){centerOn(st.cx,st.cy)}else{const [hx,hy]=toM(HOME.lat+0.004,HOME.lng+0.012);centerOn(hx,hy)}draw()}
addEventListener('resize',()=>{clamp();draw()});
IMG.onload=()=>{if(!booted){booted=true;boot()}else draw()};let booted=false;setMap();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
